name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A PR's run is grouped by its number, never by github.ref: a pull_request event
# that arrives after the PR is merged carries refs/heads/master, and would cancel
# the master run (and its deploy).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, tipos y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Same pnpm the Dockerfile pins; package.json carries no packageManager.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  image:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Proves the runner image builds; the deploy job builds its own copy on
      # the server.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          cache-from: type=gha
          # Saving the cache is a speed-up, not a check: a run without write
          # access (a PR already merged) still passes.
          cache-to: type=gha,mode=max,ignore-error=true

  # The runner lives on the intranet server and connects out to GitHub, so the
  # server opens no port for this. Setup: docs/deploy.md.
  deploy:
    name: Desplegar en intranet.jdh.com.co
    needs: [check, image]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: [self-hosted, internal-platform-ui]
    timeout-minutes: 30
    environment: produccion
    concurrency:
      group: deploy-platform-ui
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/deploy.sh
        env:
          GIT_SHA: ${{ github.sha }}

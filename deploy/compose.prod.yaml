# Production UI on intranet.jdh.com.co. Run it through deploy/deploy.sh.
# Values without a default come from ~/apps/platform/ui.env (docs/deploy.md).
#
# Caddy is not here: it lives in the edge stack (compose project
# `intranet-jdh`, owned by INTRANET-JDH-API deploy/) together with Strapi and
# Postgres. The UI joins that stack's network so Caddy reaches it as
# `platform-ui:3000`; the API will join the same network as `platform-api:8000`.
name: internal-platform

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  ui:
    build:
      context: ..
      target: runner
      args:
        # Same origin as the API behind Caddy: the session cookie reaches
        # fetch and <img> without CORS.
        NEXT_PUBLIC_API_URL: https://${PUBLIC_HOST:-intranet.jdh.com.co}/api/v1
      labels:
        org.opencontainers.image.revision: ${GIT_SHA:-unknown}
    image: internal-platform-ui:latest
    container_name: platform-ui
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://${PUBLIC_HOST:-intranet.jdh.com.co}
      # Server-side calls: by internal name, never out through Caddy.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://platform-api:8000/api/v1}
      STRAPI_URL: ${STRAPI_URL:-http://intranet-cms:1337}
      # What the browser loads media from: Caddy forwards /cms/uploads/* to Strapi.
      STRAPI_PUBLIC_URL: https://${PUBLIC_HOST:-intranet.jdh.com.co}/cms
      # Same value as the edge stack's STRAPI_WEBHOOK_SECRET (CMS revalidation webhook).
      STRAPI_WEBHOOK_SECRET: ${STRAPI_WEBHOOK_SECRET:?set STRAPI_WEBHOOK_SECRET in ~/apps/platform/ui.env}
    volumes:
      # The basemap of the commercial map: colombia.pmtiles (about 600 MB) and
      # the Centrale Sans glyphs. Too big for the image and for git, so it is
      # copied to the server once and served from /mapas like any public file
      # (docs/mapa-comercial.md). Read at start: new files need a restart.
      - ${MAP_ASSETS_DIR:?run through deploy/deploy.sh, which sets MAP_ASSETS_DIR}:/app/public/mapas:ro
    networks:
      edge:
        aliases:
          - platform-ui
    logging: *logging

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:-intranet-jdh_default}
